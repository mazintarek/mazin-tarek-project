<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs</title>
  <style>
    body{
      background:linear-gradient(320deg , #FFF004 , #FF1F04 , #04FFF2);
      color: #fff;
      height:100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      
      
    }
    #frame{
      background:linear-gradient(320deg , #04FFF2 , #FF1F04 , #FFF004);
      width: 300px;
      height: 210px;
      
      color: white;
      text-align: center;
      border: solid 7px black;
    }
    #frame p{
      font-size: 20px;
      text-align: center;
      padding-top: 10px
      
    }
    #frame button{
      margin-top:50px ;
      width: 90%;
      border-radius: 10px;
      color: #000;
      background: #fff
     
      
    }
  </style>
</head>
<body>
<div id="frame">
  <p id="prag"></p>
  <button id="btn">التالي </button>
</div>
<script>
  let prag = document.getElementById('prag')
let btn = document.getElementById('btn')
let name;
let changeName;
let jobs = [
  'دكتور', 'مهندس', 'معلم',
  'طبيب أسنان', 'صيدلي', 'ممرض', 'طبيب بيطري',
  'محاسب', 'محامي', 'قاضي', 'مستشار قانوني',
  'مبرمج', 'مصمم جرافيك', 'مهندس برمجيات', 'محلل بيانات',
  'مدير مشروع', 'مدير تسويق', 'مدير مبيعات', 'مدير موارد بشرية',
  'صحفي', 'كاتب', 'محرر', 'مترجم',
  'فنان', 'موسيقي', 'ممثل', 'مخرج',
  'طيار', 'مهندس طيران', 'ربان سفينة', 'سائق',
  'عالم', 'باحث', 'أستاذ جامعي', 'معلم لغة',
  'طاهي', 'نادل', 'مدير مطعم', 'خباز',
  'سباك', 'كهربائي', 'نجار', 'حداد',
  'عامل بناء', 'مهندس معماري', 'مصمم ديكور', 'مخطط مدن',
  'رجل أعمال', 'مستثمر', 'تاجر', 'سمسار عقارات',
  'عامل نظافة', 'حارس أمن', 'ساعي بريد', 'موظف استقبال'
];


if (localStorage.Name != null) {
  name = JSON.parse(localStorage.Name)
} else {
  name = [];
}
let i = 0;
   prag.innerHTML= ` ادي التلفون ل ${name[i].name}  عشان يعرف هو بره ولا لا    `
i++

let num = 1
 let change;
 let change2 = [];
 window.onload= function () {
   change = Math.floor(Math.random()*jobs.length)
    changeName=Math.floor(Math.random()*name.length+1)
    for (var i = 0; i <= 9; i++) {
     let change3 = Math.floor(Math.random()*jobs.length+i)
      change2.push(jobs[change3])
    }
    localStorage.setItem('change2',JSON.stringify(change2))
   localStorage.setItem('ChangeName',JSON.stringify(name[changeName].name))
   localStorage.setItem('answer',JSON.stringify(jobs[change]))
 }
btn.onclick= function () {
  
   
  if (num === 1) {
     if ( changeName=== i) {
          prag.innerHTML= `بره`
     
   } else{
        prag.innerHTML = ` ${jobs[change]} `
    }
    num++
  } else if (i=== name.length) {
    window.location.href = `../question player/quesionplayer.html`
    
     }
  else {
    prag.innerHTML= `ادي التلفون ل  ${name[i].name} عشان يعرف هو بره ولا لا`
    num=1
    i++
    

  }
}

</script>
</body>
</html>
