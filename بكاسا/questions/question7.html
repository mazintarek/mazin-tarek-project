<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make_up</title>
  <style>
    body{
      background:linear-gradient(320deg , #FFF004 , #FF1F04 , #04FFF2);
      color: #fff;
      height:100vh;
      display: flex;
      align-items: center;
      justify-content: center;
            
      
    }
    #frame{
      background:linear-gradient(320deg , #04FFF2 , #FF1F04 , #FFF004);
      width: 300px;
      height: 210px;
      
      color: white;
      text-align: center;
      border: solid 7px black;
    }
    #frame p{
      font-size: 20px;
      text-align: center;
      padding-top: 10px
      
    }
    #frame button{
      margin-top:50px ;
      width: 90%;
      border-radius: 10px;
      color: #000;
      background: #fff
     
      
    }
  </style>
</head>
<body>
<div id="frame">
  <p id="prag"></p>
  <button id="btn">التالي </button>
</div>
<script>
  let prag = document.getElementById('prag')
let btn = document.getElementById('btn')
let name;
let changeName;
let make_up = [
  'Foundation', 'Concealer', 'Powder', 'Blush',
  'Bronzer', 'Highlighter', 'Mascara', 'Eyeliner',
  'Eyeshadow', 'Lipstick', 'Lip gloss', 'Lip liner',
  'Eyebrow pencil', 'Eyebrow gel', 'Setting spray', 'Primer',
  'Makeup remover', 'BB cream', 'CC cream', 'Contour kit',
  'False lashes', 'Makeup brushes', 'Beauty blender', 'Lip balm',
  'Lip scrub', 'Face mask', 'Sunscreen', 'Moisturizer',
  'Serum', 'Cleanser', 'Toner', 'Exfoliator',
  'Setting powder', 'Lip stain', 'Cream blush', 'Gel eyeliner',
  'Liquid lipstick', 'Lip plumper', 'Eyebrow pomade', 'Eyebrow powder',
  'Eyebrow wax', 'Eyebrow pen', 'Eyebrow marker', 'Eyebrow mascara',
  'Eyebrow stencil', 'Eyebrow scissors', 'Eyebrow razor', 'Eyebrow comb'
];



if (localStorage.Name != null) {
  name = JSON.parse(localStorage.Name)
} else {
  name = [];
}
let i = 0;
   prag.innerHTML= ` ادي التلفون ل ${name[i].name}  عشان يعرف هو بره ولا لا    `
i++

let num = 1
 let change;
 let change2 = [];
 window.onload= function () {
   change = Math.floor(Math.random()*make_up.length)
    changeName=Math.floor(Math.random()*name.length+1)
     for (var i = 0; i <= 9; i++) {
        let change3 = Math.floor(Math.random()*make_up.length+i)
        change2.push(make_up[change3])
      }
      localStorage.setItem('change2', JSON.stringify(change2))
    localStorage.setItem('ChangeName',JSON.stringify(name[changeName].name))
   localStorage.setItem('answer',JSON.stringify(make_up[change]))
   
 }
btn.onclick= function () {
  
   
  if (num === 1) {
     if ( changeName=== i) {
          prag.innerHTML= `بره`
     
   } else{
        prag.innerHTML=`  ${make_up[change]} `
    }
    num++
  } else if (i=== name.length) {
    window.location.href = `../question player/quesionplayer.html`
    
     }
  else {
    prag.innerHTML= `ادي التلفون ل  ${name[i].name} عشان يعرف هو بره ولا لا`
    num=1
    i++
    

  }
}

</script>
</body>
</html>
